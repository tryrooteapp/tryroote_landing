<style>
  :root {
    --bg:        oklch(0.972 0.008 85);
    --paper:     oklch(0.985 0.006 85);
    --ink:       oklch(0.18 0.012 90);
    --ink-2:     oklch(0.32 0.012 90);
    --muted:     oklch(0.52 0.012 90);
    --line:      oklch(0.88 0.012 85);
    --line-2:    oklch(0.93 0.010 85);
    --accent:    oklch(0.44 0.075 145);
    --accent-2:  oklch(0.62 0.075 145);
    --accent-wash: oklch(0.94 0.025 145);
    --warn:      oklch(0.55 0.12 60);

    --serif: "EB Garamond", "Times New Roman", Georgia, serif;
    --sans:  "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono:  "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  ::selection { background: var(--accent); color: var(--paper); }

  a { color: inherit; }

  .mono { font-family: var(--mono); font-feature-settings: "tnum" 1; }
  .serif { font-family: var(--serif); }
  .tnum  { font-variant-numeric: tabular-nums; }

  .hairline { background: var(--line); height: 1px; width: 100%; border: 0; }

  .container {
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 56px;
  }

  /* ─── NAV ─────────────────────────────────────────────────── */
  .nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 26px 0 22px;
    border-bottom: 1px solid var(--line);
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--serif); font-weight: 400; font-size: 22px;
    letter-spacing: -0.01em;
  }
  .brand-mark {
    width: 22px; height: 22px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--accent-2), var(--accent) 60%);
    box-shadow: inset 0 0 0 1px oklch(0.30 0.05 145 / .35);
  }
  .nav-links {
    display: flex; gap: 28px; align-items: center;
    font-size: 13.5px; color: var(--ink-2);
  }
  .nav-links a { text-decoration: none; }
  .nav-links a:hover { color: var(--accent); }
  .beta-pill {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--accent);
    padding: 6px 10px 6px 8px;
    border: 1px solid color-mix(in oklch, var(--accent) 35%, transparent);
    border-radius: 999px;
    background: var(--accent-wash);
  }
  .beta-pill::before {
    content:""; width:6px; height:6px; border-radius:50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in oklch, var(--accent) 22%, transparent);
  }

  /* ─── HERO ────────────────────────────────────────────────── */
  .hero {
    padding: 88px 0 80px;
    display: grid;
    grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
    gap: 64px;
    align-items: center;
    border-bottom: 1px solid var(--line);
  }
  .hero h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(48px, 5.6vw, 72px);
    line-height: 1.04;
    letter-spacing: -0.022em;
    margin: 22px 0 22px;
    text-wrap: pretty;
  }
  .hero h1 em {
    font-style: italic;
    color: var(--accent);
    font-weight: 400;
  }
  .hero .lede {
    font-size: 18px;
    line-height: 1.55;
    color: var(--ink-2);
    max-width: 540px;
  }
  .hero-cta {
    display: flex; gap: 14px; align-items: center;
    margin-top: 32px;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 22px;
    border-radius: 999px;
    font-family: var(--sans);
    font-weight: 500;
    font-size: 14.5px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
    text-decoration: none;
  }
  .btn-primary {
    background: var(--ink);
    color: var(--paper);
    box-shadow: 0 1px 0 rgba(255,255,255,.15) inset, 0 8px 20px -10px var(--ink);
  }
  .btn-primary:hover { transform: translateY(-1px); }
  .btn-ghost {
    background: transparent;
    color: var(--ink-2);
    border-color: var(--line);
  }
  .btn-ghost:hover { color: var(--ink); border-color: var(--ink-2); }

  .hero-meta {
    margin-top: 22px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    display: flex; gap: 18px; flex-wrap: wrap;
  }
  .hero-meta span::before {
    content: "·"; margin-right: 18px; color: var(--line);
  }
  .hero-meta span:first-child::before { content: ""; margin: 0; }

  /* hero-right: a "preview card" of the daily check-in */
  .hero-right {
    position: relative;
    min-height: 460px;
  }

  /* ─── SECTION SCAFFOLDING ────────────────────────────────── */
  section.block { padding: 96px 0; border-bottom: 1px solid var(--line); }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--accent);
    display: inline-flex; align-items: center; gap: 10px;
  }
  .eyebrow::before {
    content: ""; width: 18px; height: 1px; background: var(--accent);
  }
  .section-title {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(36px, 3.6vw, 48px);
    line-height: 1.08;
    letter-spacing: -0.018em;
    margin: 18px 0 14px;
    max-width: 800px;
    text-wrap: pretty;
  }
  .section-sub {
    color: var(--ink-2);
    font-size: 17px;
    max-width: 640px;
  }

  /* ─── HOW IT WORKS ────────────────────────────────────────── */
  .steps {
    margin-top: 56px;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 0;
    border-top: 1px solid var(--line);
  }
  .step {
    padding: 36px 32px 36px 0;
    border-right: 1px solid var(--line);
    position: relative;
  }
  .step:last-child { border-right: 0; padding-right: 0; }
  .step:not(:first-child) { padding-left: 32px; }
  .step-num {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
    margin-bottom: 24px;
    display: flex; align-items: center; gap: 10px;
  }
  .step-num b {
    color: var(--accent); font-weight: 500;
  }
  .step h3 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 24px;
    line-height: 1.2;
    letter-spacing: -0.01em;
    margin: 0 0 12px;
  }
  .step p {
    margin: 0; color: var(--ink-2); font-size: 15px; line-height: 1.55;
  }
  .step-art {
    margin-top: 28px;
    height: 96px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--paper);
    overflow: hidden;
    position: relative;
  }

  /* ─── PROTOCOL GRID ───────────────────────────────────────── */
  .grid-protocols {
    margin-top: 48px;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 0;
    border-top: 1px solid var(--line);
    border-left: 1px solid var(--line);
  }
  .protocol {
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 22px 22px 26px;
    background: var(--paper);
    display: flex; flex-direction: column;
    gap: 14px;
    min-height: 168px;
    position: relative;
    transition: background .2s ease;
  }
  .protocol:hover { background: oklch(0.97 0.015 145); }
  .protocol-i {
    font-family: var(--mono); font-size: 10.5px;
    color: var(--muted); letter-spacing: 0.08em;
  }
  .protocol h4 {
    margin: 0; font-family: var(--serif); font-weight: 400;
    font-size: 22px; line-height: 1.15; letter-spacing: -0.01em;
  }
  .protocol .tag {
    margin-top: auto;
    font-family: var(--mono); font-size: 10.5px;
    color: var(--ink-2);
    text-transform: uppercase; letter-spacing: 0.1em;
  }
  .protocol .glyph {
    position: absolute; right: 18px; top: 18px;
    width: 28px; height: 28px;
  }

  /* ─── CHECK-IN DEMO ──────────────────────────────────────── */
  .checkin-wrap {
    margin-top: 56px;
    display: grid;
    grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
    gap: 64px;
    align-items: center;
  }
  .checkin-text h3 {
    font-family: var(--serif); font-weight: 400; font-size: 28px;
    margin: 0 0 16px; letter-spacing: -0.01em;
  }
  .checkin-text ul {
    margin: 24px 0 0; padding: 0; list-style: none;
    display: flex; flex-direction: column; gap: 14px;
  }
  .checkin-text li {
    display: flex; gap: 14px; align-items: flex-start;
    color: var(--ink-2); font-size: 15px; line-height: 1.5;
  }
  .checkin-text li::before {
    content: ""; flex-shrink: 0;
    width: 8px; height: 8px; margin-top: 8px; border-radius: 50%;
    background: var(--accent);
  }

  /* The phone-ish card */
  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 28px;
    box-shadow: 0 1px 0 rgba(255,255,255,.5) inset, 0 30px 60px -40px oklch(0.20 0.01 90 / .3);
  }
  .card-head {
    display: flex; align-items: center; justify-content: space-between;
    font-family: var(--mono); font-size: 11px;
    color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em;
    margin-bottom: 22px;
  }
  .card-head .live {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--accent);
  }
  .card-head .live::before {
    content:""; width:7px; height:7px; border-radius:50%;
    background: var(--accent);
    animation: livepulse 1.8s ease-in-out infinite;
  }
  @keyframes livepulse {
    0%,100% { box-shadow: 0 0 0 0 color-mix(in oklch, var(--accent) 50%, transparent); }
    50%     { box-shadow: 0 0 0 6px color-mix(in oklch, var(--accent) 0%,  transparent); }
  }

  .q-label {
    font-family: var(--mono); font-size: 11px;
    color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase;
  }
  .q-title {
    font-family: var(--serif); font-weight: 400;
    font-size: 30px; line-height: 1.15; letter-spacing: -0.012em;
    margin: 6px 0 24px;
  }

  .scale {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 6px;
  }
  .scale button {
    appearance: none; border: 1px solid var(--line);
    background: var(--bg);
    border-radius: 10px;
    height: 52px;
    font-family: var(--mono);
    font-size: 14px;
    color: var(--ink-2);
    cursor: pointer;
    transition: all .12s ease;
    font-variant-numeric: tabular-nums;
  }
  .scale button:hover { border-color: var(--ink-2); color: var(--ink); }
  .scale button.active {
    background: var(--ink); color: var(--paper); border-color: var(--ink);
    transform: translateY(-1px);
  }
  .scale-ends {
    display: flex; justify-content: space-between;
    margin-top: 12px;
    font-family: var(--mono); font-size: 11px;
    color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em;
  }

  .card-foot {
    margin-top: 26px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
    font-size: 13px; color: var(--ink-2);
  }
  .streak {
    display: flex; gap: 4px;
  }
  .streak i {
    width: 7px; height: 16px; border-radius: 2px;
    background: var(--line);
    display: inline-block;
  }
  .streak i.on { background: var(--accent); }
  .streak i.today { background: var(--accent); outline: 2px solid var(--accent-wash); }

  /* ─── RESULTS / CHART ─────────────────────────────────────── */
  .results-stats {
    margin-top: 56px;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .stat {
    padding: 28px 24px 26px 0;
    border-right: 1px solid var(--line);
  }
  .stat:last-child { border-right: 0; }
  .stat:not(:first-child) { padding-left: 24px; }
  .stat .v {
    font-family: var(--serif); font-weight: 400;
    font-size: 44px; line-height: 1; letter-spacing: -0.025em;
    display: flex; align-items: baseline; gap: 10px;
  }
  .stat .v small {
    font-family: var(--mono); font-size: 14px;
    color: var(--muted); font-weight: 400;
    letter-spacing: 0;
  }
  .stat .v .delta {
    color: var(--accent);
  }
  .stat .lbl {
    margin-top: 14px;
    font-family: var(--mono); font-size: 11px;
    color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.12em;
  }

  .chart-wrap {
    margin-top: 56px;
    padding: 36px 36px 30px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 18px;
  }
  .chart-head {
    display: flex; justify-content: space-between; align-items: flex-end;
    margin-bottom: 22px;
  }
  .chart-head h4 {
    margin: 0; font-family: var(--serif); font-weight: 400; font-size: 26px;
    letter-spacing: -0.012em;
  }
  .chart-head .meta {
    font-family: var(--mono); font-size: 11px;
    color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em;
    text-align: right;
  }
  .chart-head .meta b { color: var(--ink-2); font-weight: 500; }

  .chart {
    position: relative;
    width: 100%;
    height: 320px;
  }
  .insights {
    margin-top: 28px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    border-top: 1px solid var(--line);
  }
  .insight {
    padding: 20px 24px 20px 0;
    border-right: 1px solid var(--line);
    display: flex; gap: 14px; align-items: flex-start;
  }
  .insight:last-child { border-right: 0; padding-left: 24px; padding-right: 0; }
  .insight .marker {
    flex-shrink: 0; width: 22px; height: 22px;
    border-radius: 50%;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: var(--mono); font-size: 10px;
    display: flex; align-items: center; justify-content: center;
  }
  .insight p {
    margin: 0; font-size: 14px; line-height: 1.5; color: var(--ink-2);
  }

  /* ─── CTA ─────────────────────────────────────────────────── */
  .cta {
    padding: 110px 0 120px;
    text-align: center;
    border-bottom: 1px solid var(--line);
  }
  .cta h2 {
    font-family: var(--serif); font-weight: 400;
    font-size: clamp(44px, 5vw, 64px); line-height: 1.05;
    letter-spacing: -0.022em;
    margin: 18px auto 18px;
    max-width: 720px;
    text-wrap: pretty;
  }
  .cta p { color: var(--ink-2); font-size: 17px; max-width: 480px; margin: 0 auto 36px; }
  .cta-form {
    display: inline-flex;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 6px 6px 22px;
    align-items: center; gap: 12px;
    width: 100%; max-width: 460px;
    box-shadow: 0 1px 0 rgba(255,255,255,.4) inset, 0 16px 40px -28px var(--ink);
  }
  .cta-form input {
    flex: 1; border: 0; background: transparent;
    font-family: var(--sans); font-size: 15px; color: var(--ink);
    outline: 0; padding: 12px 0;
  }
  .cta-form input::placeholder { color: var(--muted); }
  .cta-form .btn-primary { padding: 12px 20px; font-size: 14px; }
  .cta-meta {
    margin-top: 18px;
    font-family: var(--mono); font-size: 11px;
    color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em;
  }
  .cta-url {
    display: inline-block; margin-top: 40px;
    font-family: var(--mono); font-size: 13px;
    color: var(--accent);
    letter-spacing: 0.02em;
  }

  /* ─── FOOTER ──────────────────────────────────────────────── */
  footer {
    padding: 36px 0 48px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--mono); font-size: 11px;
    color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.1em;
  }
  footer .links { display: flex; gap: 24px; }
  footer a { text-decoration: none; }
  footer a:hover { color: var(--ink); }

  /* ─── MOBILE RESPONSIVE ──────────────────────────── */
  @media (max-width: 900px) {
    .container { padding: 0 32px; }

    .hero {
      padding: 56px 0 56px;
      grid-template-columns: 1fr;
      gap: 48px;
    }
    .hero-right { min-height: 320px; }
    .hero .lede { max-width: 100%; }

    .checkin-wrap {
      grid-template-columns: 1fr;
      gap: 40px;
    }
    .checkin-wrap > :first-child { order: 2; }
    .checkin-wrap > :last-child  { order: 1; }

    .results-stats {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .stat:nth-child(2)  { border-right: 0; }
    .stat:nth-child(3)  { border-right: 1px solid var(--line); padding-left: 0; }
    .stat:nth-child(4)  { padding-left: 16px; }

    .grid-protocols {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 640px) {
    .container { padding: 0 18px; }

    .nav { padding: 16px 0 14px; gap: 10px; flex-wrap: wrap; }
    .nav-links { gap: 14px; font-size: 13px; }
    .beta-pill { display: none; }

    .hero {
      padding: 40px 0 44px;
      gap: 36px;
    }
    .hero h1 { font-size: clamp(32px, 8vw, 48px); margin: 14px 0 14px; }
    .hero .lede { font-size: 16px; }
    .hero-cta { flex-wrap: wrap; gap: 10px; }
    .btn { padding: 12px 18px; font-size: 14px; }
    .hero-right { min-height: 0; }

    section.block { padding: 56px 0; }

    .steps {
      grid-template-columns: 1fr;
      margin-top: 32px;
    }
    .step { padding: 24px 0; border-right: 0; border-bottom: 1px solid var(--line); }
    .step:last-child { border-bottom: 0; }
    .step:not(:first-child) { padding-left: 0; }

    .grid-protocols { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 24px; }
    .protocol { min-height: 0; padding: 14px 14px 16px; gap: 6px; }
    .protocol h4 { font-size: 17px; }
    .protocol .glyph { width: 20px; height: 20px; right: 12px; top: 12px; }

    .checkin-wrap { gap: 28px; margin-top: 36px; }
    .card { padding: 20px; }
    .q-title { font-size: 22px; }

    .scale { grid-template-columns: repeat(5, 1fr); gap: 5px; }
    .scale button { height: 44px; font-size: 13px; }

    .results-stats {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-top: 32px;
    }
    .stat { padding: 18px 12px 16px 0; }
    .stat:not(:first-child) { padding-left: 12px; }
    .stat .v { font-size: 32px; }
    .stat:nth-child(2) { border-right: 0; }
    .stat:nth-child(3) { border-right: 1px solid var(--line); padding-left: 0; }
    .stat:nth-child(4) { padding-left: 12px; }

    .chart-wrap { padding: 20px 16px 18px; margin-top: 32px; }
    .chart { height: 200px; }
    .chart-head { flex-direction: column; align-items: flex-start; gap: 6px; }
    .chart-head h4 { font-size: 20px; }

    .insights { grid-template-columns: 1fr; }
    .insight { border-right: 0; padding: 16px 0; border-bottom: 1px solid var(--line); }

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // deck-stage enables its rail in connectedCallback, but this panel can
  // mount before that element has upgraded. The initial read catches the
  // common case; the listener covers mounting first. (Older deck-stage.js
  // copies still wait for the host's __omelette_rail_enabled postMessage —
  // same listener handles those.)
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

const ENERGY_30 = [
  4.2, 4.5, 3.8, 4.6, 4.0, 4.4, 5.0,
  4.8, 5.2, 5.0, 5.5, 5.3, 5.6, 5.4,
  6.0, 6.4, 6.2, 7.0, 7.2, 6.8, 7.4,
  7.0, 7.5, 7.3, 7.6, 7.4, 7.7, 7.5, 7.6, 7.6,
];

const DAY_NOTES = {
  1:  "Day 1 baseline — protocol just kicked off.",
  7:  "End of week 1. Sleep window still drifting late.",
  12: "Added morning sunlight at wake-up.",
  15: "Red light timing locked to 7:00 AM daily.",
  18: "Biggest week-over-week jump.",
  22: "Skipped red light. Score dropped 0.5.",
  28: "Sustained — protocol holding.",
  30: "Day 30. Plateau at 7.5+. Time to tune.",
};

function ResultsChart({ showGridlines }) {
  const [hover, setHover] = useState(null);
  const w = 1080, h = 320;
  const padL = 44, padR = 16, padT = 28, padB = 36;
  const innerW = w - padL - padR;
  const innerH = h - padT - padB;
  const min = 3, max = 9;
  const xs = (i) => padL + (i / (ENERGY_30.length - 1)) * innerW;
  const ys = (v) => padT + (1 - (v - min) / (max - min)) * innerH;

  // area path
  const linePath = ENERGY_30.map((v, i) => `${i === 0 ? "M" : "L"}${xs(i).toFixed(1)} ${ys(v).toFixed(1)}`).join(" ");
  const areaPath = `${linePath} L${xs(ENERGY_30.length - 1).toFixed(1)} ${(padT + innerH).toFixed(1)} L${xs(0).toFixed(1)} ${(padT + innerH).toFixed(1)} Z`;

  const xAxisDays = [1, 4, 7, 10, 13, 16, 19, 22, 25, 28, 30];
  const yTicks = [3, 5, 7, 9];

  // week-3 jump band (days 15-21 → indices 14-20)
  const bandStart = xs(14), bandEnd = xs(20);

  return (
    <div className="chart-wrap">
      <div className="chart-head">
        <h4>Energy score — day 1 to day 30</h4>
        <div className="meta">
          <div>Scale: 1 (exhausted) → 10 (best ever)</div>
          <div><b>Goal:</b> Sustained daily energy · <b>Gear:</b> Red light panel</div>
        </div>
      </div>

      <div className="chart">
        <svg viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none"
             style={{ width: "100%", height: "100%", display: "block", overflow: "visible" }}
             onMouseLeave={() => setHover(null)}>
          <defs>
            <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"  stopColor="var(--accent)" stopOpacity="0.15" />
              <stop offset="100%" stopColor="var(--accent)" stopOpacity="0" />
            </linearGradient>
          </defs>

          {/* week-3 band */}
          <rect x={bandStart} y={padT} width={bandEnd - bandStart} height={innerH}
                fill="var(--accent-wash)" opacity="0.55" />
          <text x={(bandStart + bandEnd) / 2} y={padT + 14}
                fontFamily="var(--mono)" fontSize="10" fill="var(--accent)"
                textAnchor="middle" letterSpacing="0.08em" style={{ textTransform: "uppercase" }}>
            WEEK 3 — BIGGEST JUMP
          </text>

          {/* gridlines */}
          {showGridlines && yTicks.map((t) => (
            <line key={t} x1={padL} x2={w - padR} y1={ys(t)} y2={ys(t)}
                  stroke="var(--line)" strokeWidth="1" strokeDasharray="2 4" />
          ))}

          {/* y labels */}
          {yTicks.map((t) => (
            <text key={t} x={padL - 10} y={ys(t) + 4}
                  fontFamily="var(--mono)" fontSize="11" fill="var(--muted)"
                  textAnchor="end">{t}</text>
          ))}

          {/* area + line */}
          <path d={areaPath} fill="url(#area)" />
          <path d={linePath} stroke="var(--accent)" strokeWidth="1.75"
                fill="none" strokeLinecap="round" strokeLinejoin="round" />

          {/* points */}
          {ENERGY_30.map((v, i) => {
            const isHover = hover === i;
            const hasNote = !!DAY_NOTES[i + 1];
            return (
              <g key={i}>
                {/* invisible hover target */}
                <rect x={xs(i) - innerW / ENERGY_30.length / 2}
                      y={padT} width={innerW / ENERGY_30.length} height={innerH}
                      fill="transparent" onMouseEnter={() => setHover(i)} />
                <circle cx={xs(i)} cy={ys(v)}
                        r={isHover ? 5 : hasNote ? 3 : 2}
                        fill={isHover ? "var(--accent)" : hasNote ? "var(--accent)" : "var(--paper)"}
                        stroke="var(--accent)" strokeWidth="1.25" />
              </g>
            );
          })}

          {/* x labels */}
          {xAxisDays.map((d) => (
            <text key={d} x={xs(d - 1)} y={h - 14}
                  fontFamily="var(--mono)" fontSize="11" fill="var(--muted)"
                  textAnchor="middle">D{d}</text>
          ))}

          {/* hover tooltip */}
          {hover !== null && (
            <g>
              <line x1={xs(hover)} x2={xs(hover)} y1={padT} y2={padT + innerH}
                    stroke="var(--accent)" strokeWidth="1" strokeDasharray="2 3" opacity="0.5" />
              {(() => {
                const tx = Math.min(Math.max(xs(hover), padL + 100), w - padR - 100);
                const ty = padT + 10;
                const note = DAY_NOTES[hover + 1];
                return (
                  <g transform={`translate(${tx}, ${ty})`}>
                    <rect x="-94" y="0" width="188" height={note ? 50 : 32}
                          rx="6" fill="var(--ink)" />
                    <text x="-84" y="16" fontFamily="var(--mono)" fontSize="11"
                          fill="var(--paper)" letterSpacing="0.04em">
                      D{hover + 1}  ·  {ENERGY_30[hover].toFixed(1)} / 10
                    </text>
                    {note && (
                      <text x="-84" y="36" fontFamily="var(--sans)" fontSize="10.5"
                            fill="oklch(0.85 0.01 90)">
                        {note.length > 32 ? note.slice(0, 30) + "…" : note}
                      </text>
                    )}
                  </g>
                );
              })()}
            </g>
          )}

          {/* axis lines */}
          <line x1={padL} x2={w - padR} y1={padT + innerH} y2={padT + innerH}
                stroke="var(--line)" />
        </svg>
      </div>

      <div className="insights">
        <div className="insight">
          <span className="marker">1</span>
          <p><b style={{ color: "var(--ink)", fontWeight: 500 }}>Red light days</b> score 1.4 points higher on average than non-red-light days.</p>
        </div>
        <div className="insight">
          <span className="marker">2</span>
          <p><b style={{ color: "var(--ink)", fontWeight: 500 }}>Sleep before 11 PM</b> correlates with next-day energy scores above 7.</p>
        </div>
      </div>
    </div>
  );
}

function Results({ showGridlines }) {
  return (
    <section className="block">
      <div className="container">
        <span className="eyebrow">Results</span>
        <h2 className="section-title">What your results actually look like.</h2>
        <p className="section-sub">Here's a real example — 30 days on the energy protocol, tracked entirely through daily check-ins. Hover any day to see what changed.</p>

        <div className="results-stats">
          <div className="stat">
            <div className="v">4.2 <small>→</small> <span className="delta">7.6</span></div>
            <div className="lbl">Avg energy score</div>
          </div>
          <div className="stat">
            <div className="v">81<small>%</small></div>
            <div className="lbl">Protocol consistency</div>
          </div>
          <div className="stat">
            <div className="v"><span className="delta">+2.1</span></div>
            <div className="lbl">Avg sleep quality lift</div>
          </div>
          <div className="stat">
            <div className="v">30<small>d</small></div>
            <div className="lbl">First measurable signal</div>
          </div>
        </div>

        <ResultsChart showGridlines={showGridlines} />
      </div>
    </section>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // apply palette → CSS variables on :root
  useEffect(() => {
    const p = PALETTES[t.palette] || PALETTES.moss;
    document.documentElement.style.setProperty("--accent",      p.accent);
    document.documentElement.style.setProperty("--accent-2",    p.accent2);
    document.documentElement.style.setProperty("--accent-wash", p.wash);
  }, [t.palette]);

  return (
    <>
      <Header />
      <Hero heroVariant={t.heroVariant} />
      <div id="how"><HowItWorks /></div>
      <div id="protocols"><ProtocolLibrary /></div>
      <CheckinDemo />
      <div id="results"><Results showGridlines={t.showGridlines} /></div>
      <div id="beta"><CTA /></div>
      <Footer />

      <TweaksPanel>
        <TweakSection label="Brand" />
        <TweakColor
          label="Accent palette"
          value={(PALETTES[t.palette] || PALETTES.moss).accent}
          options={Object.values(PALETTES).map(p => p.accent)}
          onChange={(v) => {
            const found = Object.keys(PALETTES).find(k => PALETTES[k].accent === v);
            if (found) setTweak('palette', found);
          }}
        />

        <TweakSection label="Hero copy" />
        <TweakRadio
          label="Headline"
          value={t.heroVariant}
          options={["default", "proof", "signal"]}
          onChange={(v) => setTweak('heroVariant', v)}
        />

        <TweakSection label="Chart" />
        <TweakToggle
          label="Show gridlines"
          value={t.showGridlines}
          onChange={(v) => setTweak('showGridlines', v)}
        />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<App />);
